name: N94 iPhone 4S QEMU Syntax & Object Verification

on:
  push:
    branches: [ main ]
    paths: [ 'hw/arm/**', 'ci/n94_smoke.py', 'ci/n94_cdma_test.py', 'ci/n94_display_test.py', '.github/workflows/n94-qemu-check.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'hw/arm/**', 'ci/n94_smoke.py', 'ci/n94_cdma_test.py', 'ci/n94_display_test.py', '.github/workflows/n94-qemu-check.yml' ]
  workflow_dispatch:
    inputs:
      kernel_probe:
        description: Download verified stock 13G37 firmware and collect actual kernel traces
        type: boolean
        default: false

jobs:
  build-n94-qemu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout un1box repository
        uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git ninja-build pkg-config python3-venv python3-pip \
            libglib2.0-dev libpixman-1-dev libssl-dev flex bison

      - name: Clone qemu-ios repository
        run: |
          git clone --depth 1 https://github.com/samhenrigold/qemu-ios.git qemu_src

      - name: Copy n94 source files into qemu_src/hw/arm
        run: |
          cp -v hw/arm/n94_*.c qemu_src/hw/arm/
          cp -v hw/arm/s5l8940_*.c qemu_src/hw/arm/
          cp -v hw/arm/s5l8940_soc.h qemu_src/hw/arm/

      - name: Register n94 in qemu_src/hw/arm/meson.build
        run: |
          python3 - << 'PY'
          with open('qemu_src/hw/arm/meson.build', 'r') as f:
              content = f.read()
          insertion = """
          # iPhone 4S (n94 / S5L8940)
          arm_ss.add(files(
            'n94_board.c',
            'n94_display.c',
            'n94_uart.c',
            's5l8940_soc.c',
            's5l8940_aic.c',
            's5l8940_pmgr.c',
            's5l8940_gpio.c',
            's5l8940_pl310.c',
            's5l8940_cdma.c',
            's5l8940_usb.c',
            's5l8940_i2s_switch.c',
            's5l8940_sgx_control.c',
            's5l8940_dwi.c',
            's5l8940_mipi.c',
            's5l8940_dart.c',
          ))
          """
          marker = "hw_arch += {'arm': arm_ss}"
          assert marker in content, "hw_arch marker not found"
          content = content.replace(marker, insertion + "\n" + marker)
          with open('qemu_src/hw/arm/meson.build', 'w') as f:
              f.write(content)
          PY

      - name: Configure QEMU (arm-softmmu)
        run: |
          cd qemu_src
          ./configure --target-list=arm-softmmu --disable-werror --extra-ldflags="-lcrypto"

      - name: Compile iPhone 4S objects
        run: |
          cd qemu_src
          # Find exact meson/ninja object targets for n94 and s5l8940
          TARGETS=$(ninja -C build -t targets all | grep -E "libqemu-arm-softmmu\.a\.p/hw_arm_(n94|s5l8940).*\.c\.o" | cut -d: -f1 | tr '\n' ' ')
          echo "Discovered ninja targets: $TARGETS"
          ninja -C build $TARGETS

      - name: Link and test qemu-system-arm with n94 machine
        run: |
          cd qemu_src
          ninja -C build qemu-system-arm
          echo "=== Verifying registered machines ==="
          ./build/qemu-system-arm -M help | grep -E "n94|iPhone-4S"
          echo "=== QEMU machine registration verified successfully! ==="

      - name: Execute ARM payload on both n94 machine names and test reset
        run: python3 ci/n94_smoke.py qemu_src/build/qemu-system-arm

      - name: Verify CDMA scatter-gather data and IRQ signals against real devices
        run: python3 ci/n94_cdma_test.py qemu_src/build/qemu-system-arm

      - name: Verify guest framebuffer is visible in QEMU console
        run: python3 ci/n94_display_test.py qemu_src/build/qemu-system-arm

      - name: Package verified host emulator for repeatable kernel probes
        run: |
          mkdir -p n94-host
          strip qemu_src/build/qemu-system-arm -o n94-host/qemu-system-arm
          ldd n94-host/qemu-system-arm > n94-host/ldd.txt
          git -C qemu_src rev-parse HEAD > n94-host/qemu-revision.txt
          python3 - <<'PY'
          import hashlib, json, pathlib
          files = list(pathlib.Path('hw/arm').glob('n94_*.c')) + list(pathlib.Path('hw/arm').glob('s5l8940_*.[ch]'))
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          pathlib.Path('n94-host/models.json').write_text(json.dumps(hashes, indent=2))
          PY

      - name: Keep verified host emulator
        uses: actions/upload-artifact@v4
        with:
          name: n94-host-qemu
          path: n94-host/
          retention-days: 7

      - name: Prepare diagnostic boot images from verified Apple firmware
        if: github.event_name == 'workflow_dispatch' && inputs.kernel_probe
        run: |
          python3 -m pip install cryptography
          curl --fail --location --retry 3 --max-time 600 \
            'https://updates.cdn-apple.com/2019/ios/041-80043-20190722-6C65AD27-69D8-499C-BC15-DE7AC74DE2BD/iPhone4,1_9.3.6_13G37_Restore.ipsw' -o n94-input.ipsw
          python3 ci/n94_prepare_kernel.py --ipsw n94-input.ipsw --output n94-images

      - name: Trace actual iOS kernel with both boot-args version candidates
        if: github.event_name == 'workflow_dispatch' && inputs.kernel_probe
        timeout-minutes: 3
        run: python3 ci/n94_kernel_probe.py qemu_src/build/qemu-system-arm n94-images n94-traces

      - name: Keep diagnostic traces without redistributing firmware
        if: always() && github.event_name == 'workflow_dispatch' && inputs.kernel_probe
        uses: actions/upload-artifact@v4
        with:
          name: n94-kernel-traces
          path: |
            n94-traces/
            n94-images/*-layout.json
          if-no-files-found: warn
