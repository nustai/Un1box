name: N94 real kernel diagnostic

on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: Successful QEMU verification run containing n94-host-qemu
        required: true
      restore_ramdisk:
        description: Add the actual restore HFS ramdisk as md0 (recovery userspace, not SpringBoard)
        type: boolean
        default: false
      breakpoint:
        description: Optional guest instruction address for MMU translation capture
        required: false
        type: string
      diagnostic_no_secure_root:
        description: Diagnostic only - remove stock md secure-root policy (insecure)
        type: boolean
        default: false
      follow_breakpoint:
        description: Optional second breakpoint after the first stop
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install host runtime and firmware decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-0 libpixman-1-0 libssl3 python3-pip
          python3 -m pip install cryptography
      - name: Fetch verified emulator
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RUN: ${{ inputs.engine_run_id }}
        run: |
          gh run download "$ENGINE_RUN" --repo "$GITHUB_REPOSITORY" --name n94-host-qemu --dir n94-host
          chmod +x n94-host/qemu-system-arm
          python3 - <<'PY'
          import hashlib, json, pathlib
          for name, expected in json.loads(pathlib.Path('n94-host/models.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, f'Stale engine: {name}'
          PY
          ./n94-host/qemu-system-arm -M help | grep iPhone-4S
      - name: Prepare actual stock kernel inputs
        env:
          RESTORE_RAMDISK: ${{ inputs.restore_ramdisk }}
          DIAGNOSTIC_NO_SECURE_ROOT: ${{ inputs.diagnostic_no_secure_root }}
        run: |
          curl --fail --location --retry 3 --max-time 600 \
            'https://updates.cdn-apple.com/2019/ios/041-80043-20190722-6C65AD27-69D8-499C-BC15-DE7AC74DE2BD/iPhone4,1_9.3.6_13G37_Restore.ipsw' -o n94-input.ipsw
          python3 ci/n94_prepare_test.py
          flags=()
          if [ "$RESTORE_RAMDISK" = true ]; then flags+=(--restore-ramdisk); fi
          if [ "$DIAGNOSTIC_NO_SECURE_ROOT" = true ]; then flags+=(--diagnostic-no-secure-root); fi
          python3 ci/n94_prepare_kernel.py --ipsw n94-input.ipsw "${flags[@]}" --output n94-images
      - name: Capture actual guest execution
        timeout-minutes: 6
        env:
          N94_BREAKPOINT: ${{ inputs.breakpoint }}
          N94_FOLLOW_BREAKPOINT: ${{ inputs.follow_breakpoint }}
        run: python3 ci/n94_kernel_probe.py n94-host/qemu-system-arm n94-images n94-traces --seconds 120
      - name: Verify observed restore userspace
        if: inputs.diagnostic_no_secure_root && inputs.restore_ramdisk && inputs.breakpoint == ''
        run: python3 ci/n94_restore_evidence.py n94-images n94-traces
      - name: Keep traces, never firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n94-kernel-traces
          path: |
            n94-traces/
            n94-images/*-layout.json
          if-no-files-found: warn
